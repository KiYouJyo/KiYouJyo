  <rect x="1" y="1" width="1198" height="298" rx="0" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <line x1="400" y1="1" x2="400" y2="299" stroke="#d0d7de" stroke-width="2"/>
  <line x1="800" y1="1" x2="800" y2="299" stroke="#d0d7de" stroke-width="2"/>
  <line x1="1" y1="92" x2="1199" y2="92" stroke="#d0d7de" stroke-width="2"/>
  <text x="200" y="62" text-anchor="middle" class="title">🏙️  Urban Research</text>
